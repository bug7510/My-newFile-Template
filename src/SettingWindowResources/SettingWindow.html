<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="{securityPolicy}">
    <link rel="stylesheet" href="{cspSource}.css">
    <script type="module" src="{cspSource}.js"></script>
</head>

<body>
    <h1>Template Settings</h1>
    <label for="templateName">TemplateName</label>
    <br>
    <input type="text" id="templateName" value="">
    <br>
    <br>
    <div class="editor-container">
        <label for="filename">Filename</label>
        <br>
        <input type="text" id="filename" value="" class="js-suggestible-input">
    </div>
    <br>
    <br>
    <div class="editor-container">
        <label for="template">Template</label>
        <br>
        <textarea id="template" class="js-suggestible-input"></textarea>
    </div>
    <br>
    <button id="decideButton">Save</button>
    <button id="cancelButton">Cancel</button>
</body>

</html>
